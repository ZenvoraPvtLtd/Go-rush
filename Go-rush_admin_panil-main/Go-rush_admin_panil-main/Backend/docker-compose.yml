version: '3.8'
services:
  # PostgreSQL with PostGIS for location data
  db:
    image: postgis/postgis:15-3.3
    container_name: gorush_db
    environment:
      POSTGRES_USER: gorush_admin
      POSTGRES_PASSWORD: gorush_password
      POSTGRES_DB: gorush_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Redis for queues (BullMQ) and live locations
  redis:
    image: redis:7-alpine
    container_name: gorush_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
